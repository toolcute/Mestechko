<style> /* MD3E Expressive Dark/Warm Theme Variables */ :root { --md-sys-color-background: #141210; --md-sys-color-surface: #1C1917; --md-sys-color-surface-container: #26221F; --md-sys-color-surface-container-high: #322D29; --md-sys-color-primary: #E8C4A2; --md-sys-color-on-primary: #442B07; --md-sys-color-primary-container: #5D411B; --md-sys-color-on-primary-container: #FFDDC3; --md-sys-color-outline: #857467; --md-sys-color-outline-variant: #494541; --md-sys-color-on-surface: #EDE0DB; --md-sys-color-on-surface-variant: #D3C4BE;

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
body { background-color: var(--md-sys-color-background); color: var(--md-sys-color-on-surface); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 60px; overflow-x: hidden; }
/* Кастомный MD3E курсор */ .md3-cursor { position: fixed; top: -50px; left: -50px; width: 22px; height: 22px; background-color: var(--md-sys-color-primary); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); transition: width 0.22s cubic-bezier(0.2, 0, 0, 1), height 0.22s cubic-bezier(0.2, 0, 0, 1), background-color 0.2s, border-radius 0.22s; z-index: 9999; mix-blend-mode: difference; }
.md3-cursor.hovered { width: 46px; height: 46px; background-color: var(--md-sys-color-on-primary-container); border-radius: 16px; opacity: 0.9; }
.md3-cursor.clicking { width: 16px; height: 16px; }
@media (pointer: coarse) { .md3-cursor { display: none; } }
/* Шапка сайта */ header { width: 100%; max-width: 1120px; padding: 32px 24px 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }

.news-card:hover { background-color: var(--md-sys-color-surface-container); border-color: var(--md-sys-color-outline); transform: translateY(-2px); }
.news-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--md-sys-color-outline); }

.news-title { font-size: 20px; font-weight: 600; color: var(--md-sys-color-on-surface); line-height: 1.3; }

/* Правый разрез (Сайдбар приколов и бамперов) */ aside.sidebar-cutout { background-color: var(--md-sys-color-surface); border-radius: var(--md-shape-corner-extra-large); padding: 20px; border: 1px solid var(--md-sys-color-outline-variant); display: flex; flex-direction: column; gap: 20px; position: sticky; top: 24px; }
.sidebar-header { display: flex; justify-content: space-between; align-items: center; }
.sidebar-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--md-sys-color-outline); }
/* Прокручиваемая шуточная реклама (Карусель) */ .joke-carousel { position: relative; border-radius: var(--md-shape-corner-large); overflow: hidden; background-color: var(--md-sys-color-surface-container); border: 1px solid var(--md-sys-color-outline-variant); }
.carousel-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; }
.carousel-track::-webkit-scrollbar { display: none; }
.joke-slide { flex: 0 0 100%; scroll-snap-align: start; display: flex; flex-direction: column; }
.joke-slide img { width: 100%; height: 170px; object-fit: cover; display: block; background-color: var(--md-sys-color-surface-container-high); }
.joke-caption { padding: 12px 14px; font-size: 12px; color: var(--md-sys-color-on-surface-variant); line-height: 1.4; }
.joke-caption strong { color: var(--md-sys-color-primary); display: block; margin-bottom: 2px; }
.carousel-controls { display: flex; gap: 6px; }
.carousel-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--md-sys-color-outline-variant); background-color: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface); display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
.carousel-btn:hover { background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }

.bumpers-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-start; }
/* Стилизация классических кнопок 88x31 в эстетике сайта */ .bumper-item { width: 88px; height: 31px; border: 1px solid var(--md-sys-color-outline); background-color: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface); font-size: 9px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.05; padding: 2px 4px; image-rendering: pixelated; transition: transform 0.15s, border-color 0.15s; overflow: hidden; }
.bumper-item:hover { transform: scale(1.06); border-color: var(--md-sys-color-primary); }
.bumper-item img { width: 88px; height: 31px; object-fit: cover; display: block; }
footer { margin-top: 48px; font-size: 13px; color: var(--md-sys-color-outline); text-align: center; } </style> </head> <body>

<!-- Основная сеточка + Правый разрез --> <div class="layout-wrapper"> <!-- Левая колонка: Новости --> <main> <div class="section-title">Новости столицы Южного Урала</div> <div id="news-container"> <div class="status-box">Загрузка свежих новостей...</div> </div> </main>

<script> // 1. Логика курсора = document.getElementById('cursor');
window.addEventListener('mousemove', (e) => { cursor.style.left = ${e.clientX}px; cursor.style.top = ${e.clientY}px; });
window.addEventListener('mousedown', () => cursor.classList.add('clicking')); window.addEventListener('mouseup', () => cursor.classList.remove('clicking'));
// Делегирование наведения для всех интерактивных элементов document.addEventListener('mouseover', (e) => { if (e.target.closest('a, button, .news-card, .bumper-item')) { cursor.classList.add('hovered'); } });
document.addEventListener('mouseout', (e) => { if (e.target.closest('a, button, .news-card, .bumper-item')) { cursor.classList.remove('hovered'); } });
// 2. Логика прокрутки шуточной рекламы const track = document.getElementById('carousel-track'); const prevBtn = document.getElementById('prev-slide'); const nextBtn = document.getElementById('next-slide');
prevBtn.addEventListener('click', () => { track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' }); });
nextBtn.addEventListener('click', () => { if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 5) { track.scrollTo({ left: 0, behavior: 'smooth' }); } else { track.scrollBy({ left: track.clientWidth, behavior: 'smooth' }); } });
// 3. Загрузка новостей из JSON async function loadNews() { const container = document.getElementById('news-container'); try { const response = await fetch('news.json?' + new Date().getTime()); if (!response.ok) throw new Error('Файл новостей пока не создан');
const newsList = await response.json();
if (!newsList || newsList.length === 0) { container.innerHTML = <div class="status-box">Пока нет ни одной новости. Ждем первый пост </div>; return; }
container.innerHTML = ''; [...newsList].reverse().forEach(item => { const card = document.createElement('article'); card.className = 'news-card'; card.innerHTML = <div class="news-meta"> <span class="news-tag">escapeHtml(item.tag||'Челябинск')</span><span>{escapeHtml(item.date)}</span> </div> <h2 class="news-title">escapeHtml(item.title)</h2><divclass="news-text">{escapeHtml(item.text)}</div>; container.appendChild(card); }); } catch (error) { container.innerHTML = <div class="news-card" style="text-align: center; border-color: var(--md-sys-color-primary-container);"> <span class="material-symbols-rounded" style="font-size: 36px; color: var(--md-sys-color-primary); margin: 0 auto 4px;">info</span> <h2 class="news-title">Сайт «Местечко» запущен!</h2> <p class="news-text">Ожидается первый пост из Telegram-бота или появление файла <code>news.json</code> в репозитории.</p> </div>; } }
function escapeHtml(text) { if (!text) return ''; const map = { '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' }; return String(text).replace(/[&<>"']/g, m => map[m]); }
loadNews(); </script> </body> </html>
