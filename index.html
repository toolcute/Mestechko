    <style>
        /* MD3E Expressive Dark/Warm Theme Variables */
        :root {
            --md-sys-color-background: #141210;
            --md-sys-color-surface: #1C1917;
            --md-sys-color-surface-container: #26221F;
            --md-sys-color-surface-container-high: #322D29;
            --md-sys-color-primary: #E8C4A2;
            --md-sys-color-on-primary: #442B07;
            --md-sys-color-primary-container: #5D411B;
            --md-sys-color-on-primary-container: #FFDDC3;
            --md-sys-color-outline: #857467;
            --md-sys-color-outline-variant: #494541;
            --md-sys-color-on-surface: #EDE0DB;
            --md-sys-color-on-surface-variant: #D3C4BE;
            
            --md-shape-corner-extra-large: 28px;
            --md-shape-corner-large: 20px;
            --md-shape-corner-medium: 12px;
            --md-shape-corner-full: 9999px;
        }

        @media (hover: hover) and (pointer: fine) {
            html, body, a, button, .news-card, .bumper-item, .carousel-btn {
                cursor: none !important;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        /* Кастомный MD3E курсор: центральная точка + отстающее кольцо */
        .md3-cursor-dot,
        .md3-cursor-ring {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 99999;
            opacity: 0;
            transition: opacity 0.2s ease;
            will-change: transform;
        }

        .md3-cursor-dot.visible,
        .md3-cursor-ring.visible {
            opacity: 1;
        }

        .md3-cursor-dot {
            width: 8px;
            height: 8px;
            background-color: #FFFFFF;
            border-radius: 50%;
            margin-left: -4px;
            margin-top: -4px;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.4);
        }

        .md3-cursor-ring {
            width: 36px;
            height: 36px;
            border: 1.5px solid rgba(232, 196, 162, 0.75);
            background-color: rgba(232, 196, 162, 0.14);
            backdrop-filter: blur(1px);
            border-radius: 50%;
            margin-left: -18px;
            margin-top: -18px;
            transition: width 0.25s cubic-bezier(0.2, 0, 0, 1),
                        height 0.25s cubic-bezier(0.2, 0, 0, 1),
                        margin 0.25s cubic-bezier(0.2, 0, 0, 1),
                        background-color 0.2s,
                        border-color 0.2s,
                        opacity 0.2s;
        }

        .md3-cursor-ring.hovered {
            width: 54px;
            height: 54px;
            margin-left: -27px;
            margin-top: -27px;
            background-color: rgba(232, 196, 162, 0.24);
            border-color: var(--md-sys-color-primary);
        }

        .md3-cursor-ring.clicking {
            width: 26px;
            height: 26px;
            margin-left: -13px;
            margin-top: -13px;
            background-color: rgba(232, 196, 162, 0.35);
        }

        @media (hover: none), (pointer: coarse) {
            .md3-cursor-dot,
            .md3-cursor-ring {
                display: none !important;
            }
        }

    <script>
        // 1. Логика кастомного курсора MD3E (точка + плавно отстающее кольцо)
        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');
        
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let ringX = mouseX;
        let ringY = mouseY;
        let isCursorVisible = false;

        function updateCursorPos(x, y) {
            mouseX = x;
            mouseY = y;
            dot.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;

            if (!isCursorVisible) {
                ringX = mouseX;
                ringY = mouseY;
                dot.classList.add('visible');
                ring.classList.add('visible');
                isCursorVisible = true;
            }
        }

        window.addEventListener('pointermove', (e) => updateCursorPos(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => updateCursorPos(e.clientX, e.clientY));

        function animateCursorRing() {
            ringX += (mouseX - ringX) * 0.18;
            ringY += (mouseY - ringY) * 0.18;
            ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0)`;
            requestAnimationFrame(animateCursorRing);
        }
        requestAnimationFrame(animateCursorRing);

        document.addEventListener('mouseleave', () => {
            dot.classList.remove('visible');
            ring.classList.remove('visible');
            isCursorVisible = false;
        });

        window.addEventListener('mousedown', () => ring.classList.add('clicking'));
        window.addEventListener('mouseup', () => ring.classList.remove('clicking'));

        document.addEventListener('mouseover', (e) => {
            if (e.target.closest('a, button, .news-card, .bumper-item')) {
                ring.classList.add('hovered');
            }
        });

        document.addEventListener('mouseout', (e) => {
            if (e.target.closest('a, button, .news-card, .bumper-item')) {
                ring.classList.remove('hovered');
            }
        });

        // 2. Логика прокрутки блока «Крутость»
        const track = document.getElementById('carousel-track');
        const prevBtn = document.getElementById('prev-slide');
        const nextBtn = document.getElementById('next-slide');

        prevBtn.addEventListener('click', () => {
            track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' });
        });

        nextBtn.addEventListener('click', () => {
            if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 5) {
                track.scrollTo({ left: 0, behavior: 'smooth' });
            } else {
                track.scrollBy({ left: track.clientWidth, behavior: 'smooth' });
            }
        });

        // 3. Загрузка новостей из JSON
        async function loadNews() {
            const container = document.getElementById('news-container');
            try {
                const response = await fetch('news.json?' + new Date().getTime());
                if (!response.ok) throw new Error('Файл новостей пока не создан');
                
                const newsList = await response.json();
                
                if (!newsList || newsList.length === 0) {
                    container.innerHTML = `<div class="status-box">Пока нет ни одной новости.</div>`;
                    return;
                }

                container.innerHTML = '';
                [...newsList].reverse().forEach(item => {
                    const card = document.createElement('article');
                    card.className = 'news-card';
                    card.innerHTML = `
                        <div class="news-meta">
                            <span class="news-tag">${escapeHtml(item.tag || 'Челябинск')}</span>
                            <span>${escapeHtml(item.date)}</span>
                        </div>
                        <h2 class="news-title">${escapeHtml(item.title)}</h2>
                        <div class="news-text">${escapeHtml(item.text)}</div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = `
                    <div class="news-card" style="text-align: center; border-color: var(--md-sys-color-primary-container);">
                        <span class="material-symbols-rounded" style="font-size: 36px; color: var(--md-sys-color-primary); margin: 0 auto 4px;">info</span>
                        <h2 class="news-title">Сайт «Местечко» работает!</h2>
                        <p class="news-text">Ожидается первый пост... <code>news.json</code> в репозитории.</p>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        loadNews();
