<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Местечко — Новости Челябинска</title> <!-- Google Fonts: Inter & Material Symbols --> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"> <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
<style> /* MD3E Expressive Dark/Warm Theme Variables */ :root { --md-sys-color-background: #141210; --md-sys-color-surface: #1C1917; --md-sys-color-surface-container: #26221F; --md-sys-color-surface-container-high: #322D29; --md-sys-color-primary: #E8C4A2; --md-sys-color-on-primary: #442B07; --md-sys-color-primary-container: #5D411B; --md-sys-color-on-primary-container: #FFDDC3; --md-sys-color-outline: #857467; --md-sys-color-outline-variant: #494541; --md-sys-color-on-surface: #EDE0DB; --md-sys-color-on-surface-variant: #D3C4BE;
--md-shape-corner-extra-large: 28px; --md-shape-corner-large: 20px; --md-shape-corner-medium: 12px; --md-shape-corner-full: 9999px;
cursor: none; /* Кастомный курсор */ }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
body { background-color: var(--md-sys-color-background); color: var(--md-sys-color-on-surface); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 60px; }
/* Кастомный курсор */ .md3-cursor { position: fixed; top: 0; left: 0; width: 20px; height: 20px; background-color: var(--md-sys-color-primary); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s, background-color 0.2s; z-index: 9999; mix-blend-mode: difference; }
.md3-cursor.hovered { width: 44px; height: 44px; background-color: var(--md-sys-color-on-primary-container); opacity: 0.8; }
/* Шапка сайта */ header { width: 100%; max-width: 800px; padding: 32px 20px 16px 20px; display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon { width: 48px; height: 48px; background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); border-radius: var(--md-shape-corner-large); display: flex; align-items: center; justify-content: center; font-size: 26px; }
.brand-text h1 { font-size: 24px; font-weight: 700; color: var(--md-sys-color-on-surface); letter-spacing: -0.5px; }
.brand-text p { font-size: 13px; color: var(--md-sys-color-outline); }
.badge-admin { background-color: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-primary); padding: 8px 16px; border-radius: var(--md-shape-corner-full); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; text-decoration: none; transition: background 0.2s; }
.badge-admin:hover { background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
/* Основной контейнер ленты новостей */ main { width: 100%; max-width: 800px; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; margin-top: 10px; }
.section-title { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--md-sys-color-outline); margin-bottom: 4px; }
/* Карточка новости */ .news-card { background-color: var(--md-sys-color-surface); border-radius: var(--md-shape-corner-extra-large); padding: 24px; border: 1px solid var(--md-sys-color-outline-variant); transition: transform 0.2s, background-color 0.2s, border-color 0.2s; display: flex; flex-direction: column; gap: 12px; }
.news-card:hover { background-color: var(--md-sys-color-surface-container); border-color: var(--md-sys-color-outline); transform: translateY(-2px); }
.news-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--md-sys-color-outline); }
.news-tag { background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); padding: 4px 10px; border-radius: var(--md-shape-corner-medium); font-weight: 500; }
.news-title { font-size: 20px; font-weight: 600; color: var(--md-sys-color-on-surface); line-height: 1.3; }
.news-text { font-size: 15px; color: var(--md-sys-color-on-surface-variant); line-height: 1.5; }
.status-box { text-align: center; padding: 40px; color: var(--md-sys-color-outline); background: var(--md-sys-color-surface); border-radius: var(--md-shape-corner-extra-large); border: 1px dashed var(--md-sys-color-outline-variant); }
footer { margin-top: 40px; font-size: 12px; color: var(--md-sys-color-outline); text-align: center; } </style> </head> <body>
<!-- Кастомный курсор --> <div class="md3-cursor" id="cursor"></div>
<!-- Шапка --> <header> <div class="brand"> <div class="brand-icon"> <span class="material-symbols-rounded">nest_cam_wired_stand</span> </div> <div class="brand-text"> <h1>Местечко</h1> <p>Южный Урал • Челябинск</p> </div> </div> <a href="https://t.me/qrchella" target="_blank" class="badge-admin"> <span class="material-symbols-rounded" style="font-size: 16px;">bolt</span> @qrchella </a> </header>
<!-- Лента новостей --> <main> <div class="section-title">Свежая сводка</div> <div id="news-container"> <div class="status-box">Загрузка свежих новостей из Челябинска...</div> </div> </main>
<footer> Местечко • Material Design 3 Expressive • Telegram Bot </footer>
<script> // Логика кастомного курсора const cursor = document.getElementById('cursor');
window.addEventListener('mousemove', (e) => { cursor.style.left = ${e.clientX}px; cursor.style.top = ${e.clientY}px; });
const interactables = document.querySelectorAll('a, .news-card, button'); interactables.f interactables.forEach(el => { el.addEventListener('mouseenter', () => cursor.classList.add('hovered')); el.addEventListener('mouseleave', () => cursor.classList.remove('hovered')); });
// Загрузка новостей из JSON async function loadNews() { const container = document.getElementById('news-container'); try { const response = await fetch('news.json?' + new Date().getTime()); if (!response.ok) throw new Error('Файл новостей пока не создан');
const newsList = await response.json();
if (!newsList || newsList.length === 0) { container.innerHTML = <div class="status-box">Пока нет ни одной новости. Ждем первый пост из твоего Telegram-бота!</div>; return; }
container.innerHTML = ''; newsList.reverse().forEach(item => { const card = document.createElement('article'); card.className = 'news-card'; card.innerHTML = <div class="news-meta"> <span class="news-tag">escapeHtml(item.tag||'Челябинск')</span><span>{escapeHtml(item.date)}</span> </div> <h2 class="news-title">escapeHtml(item.title)</h2><divclass="news-text">{escapeHtml(item.text)}</div>; container.appendChild(card); }); } catch (error) { container.innerHTML = <div class="news-card" style="text-align: center; border-color: var(--md-sys-color-primary-container);"> <span class="material-symbols-rounded" style="font-size: 36px; color: var(--md-sys-color-primary); margin-bottom: 8px;">info</span> <h2 class="news-title">Сайт «Местечко» запущен!</h2> <p class="news-text">Ожидается первый пост из твоего Telegram-бота или файл <code>news.json</code> в репозитории.</p> </div>; } }
function escapeHtml(text) { const map = { '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' }; return text.replace(/[&<>"']/g, function(m) { return map[m]; }); }
loadNews(); </script> </body> </html>
